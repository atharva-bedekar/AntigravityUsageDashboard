[package]
name = "antigravity-usage"
version = "0.1.0"
description = "Native Windows 11 desktop dashboard for Antigravity 2.0 App and CLI token usage"
authors = ["Antigravity Usage"]
edition = "2021"

[lib]
name = "antigravity_usage_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
rayon = "1.10"
notify = "6"
regex = "1"
rand = "0.8"
rand_distr = "0.4"
url = "2"
percent-encoding = "2"
dirs = "5"
