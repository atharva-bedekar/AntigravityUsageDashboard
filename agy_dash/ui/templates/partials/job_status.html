<div class="bento-panel job-status"
     {% if runner_state and runner_state.running %}hx-get="/api/jobs/status" hx-trigger="every 2s" hx-swap="outerHTML"{% endif %}>
  <div class="workspace-heading">
    <span class="mono">Status: <b>{{ runner_state.status | capitalize if runner_state else 'Idle' }}</b></span>
    <span class="mono">Exit: {{ runner_state.exit_code if runner_state and runner_state.exit_code is not none else '-' }}</span>
  </div>
  {% if runner_state and runner_state.command %}
    <pre class="mono">{{ " ".join(runner_state.command) }}</pre>
  {% endif %}
</div>
