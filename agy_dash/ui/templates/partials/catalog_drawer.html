<dialog id="catalog-drawer" class="drawer drawer-wide" aria-labelledby="catalog-drawer-title">
  <div class="drawer-header">
    <h2 id="catalog-drawer-title">Price catalog</h2>
    <button type="button" class="btn btn-quiet" onclick="closeDrawers()" autofocus>Close</button>
  </div>
  <div class="drawer-body">
    <div class="table-container">
      <table class="data-table">
        <thead><tr><th>Model ID</th><th>Vendor</th><th class="num">Input / Mtok</th><th class="num">Cached / Mtok</th><th class="num">Output / Mtok</th><th>Effective</th></tr></thead>
        <tbody>
          {% for e in ctx.catalog.entries %}
            <tr>
              <td class="mono cell-truncate" title="{{ e.model_id }}"><b>{{ e.model_id }}</b></td>
              <td>{{ e.vendor }}</td>
              <td class="num">${{ "%.4f"|format(e.input_usd) }}</td>
              <td class="num">${{ "%.4f"|format(e.cached_usd) }}</td>
              <td class="num">${{ "%.4f"|format(e.output_usd) }}</td>
              <td class="mono">{{ e.effective_from }}</td>
            </tr>
          {% endfor %}
        </tbody>
      </table>
    </div>
  </div>
</dialog>
