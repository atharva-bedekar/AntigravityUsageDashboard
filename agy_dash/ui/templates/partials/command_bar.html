<header class="command-bar">
  <div class="command-bar-primary">
    <span class="brand-title">Antigravity Usage Dashboard</span>

    <nav class="view-nav" aria-label="Dashboard views">
      {% for view, label in [('command', 'Overview'), ('sessions', 'Sessions'), ('economics', 'Costs')] %}
        <a href="?view={{ view }}" class="nav-tab{% if filters.view == view %} active{% endif %}" data-view="{{ view }}"
           {% if filters.view == view %}aria-current="page"{% endif %}
           hx-get="/?view={{ view }}" hx-select="#workspace-canvas" hx-target="#workspace-canvas" hx-swap="outerHTML"
           hx-include="#global-filter-form" hx-params="not view" hx-push-url="true">{{ label }}</a>
      {% endfor %}
    </nav>

    <div class="deck-actions">
      <button type="button" class="btn btn-quiet" onclick="toggleTheme()" title="Switch between light and dark themes">Theme</button>
      <button type="button" class="btn btn-quiet" title="Refresh local scans"
              hx-post="/api/refresh" hx-select="#workspace-canvas" hx-target="#workspace-canvas" hx-swap="outerHTML"
              hx-include="#global-filter-form" hx-on::config-request="event.detail.useUrlParams = true">Rescan</button>
      <button type="button" class="btn" onclick="openDrawer('sync-drawer')" aria-haspopup="dialog">
        <span class="status-dot{% if runner_state and runner_state.running %} running{% endif %}"
              role="img" aria-label="{{ 'Extractor running' if runner_state and runner_state.running else 'Extractor idle' }}"></span>
        Data sync
      </button>
    </div>
  </div>

  <div class="filter-bar">
    <form id="global-filter-form" class="filter-strip" method="get" action="/"
          hx-get="/" hx-select="#workspace-canvas" hx-target="#workspace-canvas" hx-swap="outerHTML" hx-push-url="true"
          hx-on::after-request="if (event.detail.successful) this.querySelector('details').open = false">
      <input type="hidden" id="global-view-input" name="view" value="{{ filters.view }}">
      <input type="hidden" id="global-theme-input" name="theme" value="{{ filters.theme }}">

      <div class="filter-group filter-range">
        <span class="filter-group-label">Date range</span>
        <div class="filter-date-pair">
          <input type="date" name="start" value="{{ filters.start or '' }}" class="filter-input date-input" aria-label="Start date">
          <span class="panel-meta" aria-hidden="true">to</span>
          <input type="date" name="end" value="{{ filters.end or '' }}" class="filter-input date-input" aria-label="End date">
        </div>
      </div>

      <label class="filter-group filter-model">
        <span class="filter-group-label">Model</span>
        <select name="model" aria-label="Model" class="filter-input model-select" onchange="this.form.requestSubmit()">
          {% for m in model_ids %}
            <option value="{{ m }}" {% if m == filters.model_id %}selected{% endif %}>{{ m }}</option>
          {% endfor %}
        </select>
      </label>

      <label class="filter-group">
        <span class="filter-group-label">Currency</span>
        <select name="currency" aria-label="Currency" class="filter-input" onchange="this.form.requestSubmit()">
          <option value="INR" {% if ctx.currency == 'INR' %}selected{% endif %}>INR (₹)</option>
          <option value="USD" {% if ctx.currency == 'USD' %}selected{% endif %}>USD ($)</option>
          <option value="EUR" {% if ctx.currency == 'EUR' %}selected{% endif %}>EUR (€)</option>
          <option value="GBP" {% if ctx.currency == 'GBP' %}selected{% endif %}>GBP (£)</option>
        </select>
      </label>

      <div class="filter-buttons">
        <details class="pricing-options">
          <summary>Pricing inputs</summary>
          <div class="pricing-fields">
            <label class="filter-group">
              <span class="filter-group-label">USD exchange rate</span>
              <input type="number" step="0.1" name="fx" value="{{ filters.fx }}" class="filter-input">
            </label>
            <label class="filter-group">
              <span class="filter-group-label">Subscription spend</span>
              <input type="number" step="100" name="sub" value="{{ filters.sub }}" class="filter-input">
            </label>
          </div>
        </details>
        <a href="/?view={{ filters.view }}" class="btn btn-quiet">Reset</a>
        <button type="submit" class="btn btn-primary">Apply filters</button>
      </div>
    </form>
  </div>
</header>
