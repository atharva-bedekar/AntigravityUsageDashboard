<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard error · Antigravity Usage Dashboard</title>
  <link rel="stylesheet" href="/static/css/telemetry.css">
</head>
<body class="error-page">
  <main class="bento-panel">
    <h1>Couldn’t load the dashboard</h1>
    <p>{{ message }}</p>
    {% if hint %}
      <div class="callout">{{ hint }}</div>
    {% endif %}
    <a href="/" class="btn btn-primary">Back to overview</a>
  </main>
</body>
</html>
